name: saas_app
description: "SAAS App — employee app."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  go_router: ^18.0.1 # declarative routing (/splash -> /login -> ...)
  google_fonts: ^8.2.1 # Instrument Serif (display) + Geist (UI)
  video_player: ^2.14.0 # splash background video

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/splash.mp4
    - assets/splash_poster.jpg
    - assets/saas-logo.jpg
